# Compile le client Linux et l'ajoute à la release (à la publication d'une release, ou à la main avec le nom du tag).
name: Client Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à compléter (v0.2.0...)"
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Bibliothèques système de Bevy
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compiler
        run: scripts/build_linux.sh
      - name: Ajouter à la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist/Castle-v*-Linux-x64.zip --clobber
