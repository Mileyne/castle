[workspace]
resolver = "2"
members = ["shared", "client", "tools/sprite_forge", "tools/sprite_editor", "tools/live3d", "tools/model_viewer", "tools/level_editor"]

[workspace.dependencies]
bevy = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
bevy_fluent = "0.16"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
winit = { path = "vendor/winit" }
# Dessin des sprites sans instance de départ (Apple TV HD): voir vendor/bevy_sprite_render/src/render/mod.rs.
bevy_sprite_render = { path = "vendor/bevy_sprite_render" }
# Pas de regroupement des lumières par le GPU sur iOS et tvOS (Apple TV HD): voir vendor/bevy_pbr/src/cluster/mod.rs.
bevy_pbr = { path = "vendor/bevy_pbr" }
