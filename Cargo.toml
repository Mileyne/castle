[workspace]
resolver = "2"
members = ["shared", "server", "client", "tools/sprite_forge", "tools/sprite_editor", "tools/live3d"]

[workspace.dependencies]
bevy = { version = "0.19", default-features = false }
bevy_replicon = "0.44"
bevy_replicon_renet = "0.20"
serde = { version = "1", features = ["derive"] }
bevy_fluent = "0.15"
bevy_yarnspinner = "0.9"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
winit = { path = "vendor/winit" }
# Dessin des sprites sans instance de départ (Apple TV HD): voir vendor/bevy_sprite_render/src/render/mod.rs.
bevy_sprite_render = { path = "vendor/bevy_sprite_render" }
# Pas de regroupement des lumières par le GPU sur iOS et tvOS (Apple TV HD): voir vendor/bevy_pbr/src/cluster/mod.rs.
bevy_pbr = { path = "vendor/bevy_pbr" }
