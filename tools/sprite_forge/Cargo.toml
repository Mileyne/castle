[package]
name = "sprite_forge"
version = "0.1.0"
edition = "2024"
description = "Génère les planches de sprites des héros en rendant un squelette de volumes depuis huit directions"

[dependencies]
glam = "0.32"
png = "0.17"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
basis-universal = "0.3"
serde_json = "1"

[dev-dependencies]
# Relit les fichiers `.glb` exportés, pour vérifier qu'ils sont valides.
gltf = { version = "1", default-features = false, features = ["import", "names", "utils"] }
