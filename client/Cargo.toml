[package]
name = "castle_client"
version = "0.6.0"
edition = "2024"
default-run = "castle_client"

[features]
# Trace des systèmes du moteur (fichier JSON pour chrome://tracing ou Perfetto): `cargo run --release -p castle_client --features profile`
profile = ["bevy/trace_chrome"]

[dependencies]
castle_shared = { path = "../shared" }
castle_server = { path = "../server" }
# Le jeu est une scène 3D (voir `decor3d`); le regroupement de lumières 3D de Bevy est remplacé sur iOS et tvOS (voir `vendor/bevy_pbr`).
bevy = { workspace = true, default-features = false, features = ["2d", "3d", "ui", "audio", "basis-universal"] }
bevy_replicon.workspace = true
bevy_replicon_renet.workspace = true
bevy_fluent.workspace = true
serde.workspace = true
ron = "0.12"
fluent_content = "0.0.5"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
sprite_forge = { path = "../tools/sprite_forge" }

# Manettes sur iOS / tvOS (framework GameController): voir gamecontroller.rs.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
basis-universal = "0.3"
png = "0.17"
