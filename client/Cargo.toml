[package]
name = "castle_client"
version = "0.8.0"
edition = "2024"
default-run = "castle_client"

[features]
# Trace des systèmes du moteur (fichier JSON pour chrome://tracing ou Perfetto): `cargo run --release -p castle_client --features profile`
profile = ["bevy/trace_chrome"]
# Apple TV (la cible tvOS est déclarée `os = "ios"`: seule cette option la distingue de l'iPhone). Posée par `tvos/build.sh`.
tvos = []
# L'éditeur de niveaux (`castle_editor`): le jeu lui-même, avec des panneaux egui par-dessus. `cargo run --release -p castle_client --features editor --bin castle_editor`
editor = ["dep:bevy_egui"]

[dependencies]
castle_shared = { path = "../shared" }
# Le jeu est une scène 3D (voir `decor3d`); le regroupement de lumières 3D de Bevy est remplacé sur iOS et tvOS (voir `vendor/bevy_pbr`).
bevy = { workspace = true, default-features = false, features = ["2d", "3d", "ui", "audio", "basis-universal"] }
bevy_fluent.workspace = true
serde.workspace = true
ron = "0.12"
fluent_content = "0.0.5"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
sprite_forge = { path = "../tools/sprite_forge" }
bevy_egui = { version = "0.43.1", optional = true, default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }

# Manettes sur iOS / tvOS (framework GameController): voir gamecontroller.rs.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
basis-universal = "0.3"
png = "0.17"

[[bin]]
name = "castle_editor"
path = "src/bin/editor.rs"
required-features = ["editor"]
